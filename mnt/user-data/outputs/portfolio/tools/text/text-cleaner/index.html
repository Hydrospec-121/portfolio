<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Cleaner — HydroSpec Tools</title>
  <meta name="description" content="Free text cleaner — remove extra spaces, blank lines, and duplicate lines." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/tools.css" />
  <link rel="stylesheet" href="../../shared/tool-page.css" />

  <style>
    /* Small, tool-specific only: a checkbox option list. Not
       worth promoting to the shared stylesheet for one tool. */
    .cleaner-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }
    .cleaner-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .cleaner-options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--lime);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="/" class="logo">ENAN<span class="dot">.</span></a>
    <nav class="nav" id="site-nav">
      <a href="/">Home</a>
      <a href="/#about">About</a>
      <a href="/#skills">Skills</a>
      <a href="/#projects">Projects</a>
      <a href="/tools/" class="active">Tools</a>
      <a href="/#contact">Contact</a>
    </nav>
    <div class="status-badge"><span class="dot-live"></span> OPEN TO WORK</div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a> / <a href="/tools/">Tools</a> / <a href="/tools/text/">Text Tools</a> / Text Cleaner
  </nav>

  <main>
    <section class="tools-hero category-hero">
      <p class="eyebrow">// TEXT TOOLS</p>
      <h1>TEXT CLEANER</h1>
      <p>Pick the cleanup operations you want, then clean your text in one click.</p>
    </section>

    <section class="category-tools">
      <div class="tool-panel" style="max-width: 760px;">
        <div class="field-group">
          <label for="clean-input">Your text</label>
          <textarea class="tool-textarea" id="clean-input" placeholder="Paste messy text here…"></textarea>
        </div>

        <div class="cleaner-options">
          <label><input type="checkbox" id="opt-trim" checked /> Trim leading/trailing whitespace</label>
          <label><input type="checkbox" id="opt-extra-spaces" checked /> Remove extra spaces (collapse multiple spaces into one)</label>
          <label><input type="checkbox" id="opt-normalize-breaks" checked /> Normalize line breaks (Windows/Mac → Unix style)</label>
          <label><input type="checkbox" id="opt-blank-lines" /> Remove blank lines</label>
          <label><input type="checkbox" id="opt-duplicate-lines" /> Remove duplicate lines</label>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="clean-run" type="button">CLEAN TEXT</button>
          <button class="btn btn-outline" id="clean-clear" type="button">CLEAR</button>
        </div>

        <div class="field-group">
          <label for="clean-output">Cleaned result</label>
          <textarea class="tool-textarea" id="clean-output" placeholder="Cleaned text appears here…" readonly></textarea>
        </div>

        <div class="btn-row">
          <button class="btn btn-small copy-btn" id="clean-copy" type="button">COPY RESULT</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 TOUFIQUE OMAR ENAN</p>
    <p class="footer-note">HYDROSPEC TOOLS — BUILT WITH DISCIPLINE.</p>
  </footer>

  <script src="../../shared/tools.js"></script>
  <script src="../../shared/tool-page.js"></script>
  <script src="text-cleaner.js"></script>
</body>
</html>
