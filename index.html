<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Converter — HydroSpec Tools</title>
  <meta name="description" content="Free time converter — seconds, minutes, hours, days, and weeks, updated live." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../shared/base.css" />
  <link rel="stylesheet" href="../../shared/tools.css" />
  <link rel="stylesheet" href="../../shared/tool-page.css" />
</head>
<body>

  <header class="site-header">
    <a href="/" class="logo">ENAN<span class="dot">.</span></a>
    <nav class="nav" id="site-nav">
      <a href="/">Home</a>
      <a href="/#about">About</a>
      <a href="/#skills">Skills</a>
      <a href="/#projects">Projects</a>
      <a href="/tools/" class="active">Tools</a>
      <a href="/#contact">Contact</a>
    </nav>
    <div class="status-badge"><span class="dot-live"></span> OPEN TO WORK</div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a> / <a href="/tools/">Tools</a> / <a href="/tools/converters/">Converters</a> / Time Converter
  </nav>

  <main>
    <section class="tools-hero category-hero">
      <p class="eyebrow">// CONVERTERS</p>
      <h1>TIME CONVERTER</h1>
      <p>Convert between seconds, minutes, hours, days, and weeks — updates as you type.</p>
    </section>

    <section class="category-tools">
      <div class="tool-panel">
        <div class="select-row">
          <div class="field-group">
            <label for="tc-from">From</label>
            <select id="tc-from">
              <option value="seconds">Seconds</option>
              <option value="minutes" selected>Minutes</option>
              <option value="hours">Hours</option>
              <option value="days">Days</option>
              <option value="weeks">Weeks</option>
            </select>
          </div>
          <button class="swap-btn" id="tc-swap" type="button" aria-label="Swap units">⇄ SWAP</button>
          <div class="field-group">
            <label for="tc-to">To</label>
            <select id="tc-to">
              <option value="seconds">Seconds</option>
              <option value="minutes">Minutes</option>
              <option value="hours" selected>Hours</option>
              <option value="days">Days</option>
              <option value="weeks">Weeks</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="tc-value">Value</label>
          <input type="number" id="tc-value" inputmode="decimal" placeholder="Enter a number" value="1" />
        </div>

        <div class="error-msg" id="tc-error" hidden role="alert"></div>

        <div class="result-panel" aria-live="polite">
          <p class="result-label">Result</p>
          <p class="result-value" id="tc-result-value">—</p>
          <div class="btn-row">
            <button class="btn btn-small copy-btn" id="tc-copy" type="button">COPY RESULT</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 TOUFIQUE OMAR ENAN</p>
    <p class="footer-note">HYDROSPEC TOOLS — BUILT WITH DISCIPLINE.</p>
  </footer>

  <script src="../../shared/tools.js"></script>
  <script src="../../shared/tool-page.js"></script>
  <script src="time-converter.js"></script>
</body>
</html>
